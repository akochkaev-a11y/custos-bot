name: Verify private Atolin Android build
on:
  push:
    branches: [main]
    paths: ['.github/workflows/atolin-check.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: atolin-private-validation
  cancel-in-progress: false
jobs:
  verify:
    if: github.repository == 'akochkaev-a11y/custos-bot' && github.ref == 'refs/heads/main' && github.actor == 'akochkaev-a11y'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ATOLIN_SOURCE_SHA: 71683c24eafc5fa68ffa3b2b7c23dc65df8f4828
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Prepare pinned server access
        env:
          INDIRA_SSH_KEY: ${{ secrets.INDIRA_SSH_KEY }}
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "$RUNNER_TEMP/indira-ssh"
          python3 - <<'PY'
          import os,pathlib,re
          raw=os.environ['INDIRA_SSH_KEY'].strip().replace('\\n','\n')
          payload=re.sub(r'-----BEGIN OPENSSH PRIVATE KEY-----|-----END OPENSSH PRIVATE KEY-----|\s+','',raw)
          assert re.fullmatch(r'[A-Za-z0-9+/=]+',payload)
          key='-----BEGIN OPENSSH PRIVATE KEY-----\n'+'\n'.join(payload[i:i+70] for i in range(0,len(payload),70))+'\n-----END OPENSSH PRIVATE KEY-----\n'
          path=pathlib.Path(os.environ['RUNNER_TEMP'])/'indira-ssh/key';path.write_text(key);path.chmod(0o600)
          PY
          cp ops/indira_known_hosts "$RUNNER_TEMP/indira-ssh/known_hosts"
          cat > "$RUNNER_TEMP/indira-ssh/ssh" <<'SH'
          #!/usr/bin/env bash
          exec ssh -T -i "$RUNNER_TEMP/indira-ssh/key" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$RUNNER_TEMP/indira-ssh/known_hosts" -o ConnectTimeout=15 root@87.228.13.236 "$@"
          SH
          chmod 700 "$RUNNER_TEMP/indira-ssh/ssh"
      - name: Read exact private source without publishing it
        run: |
          set -euo pipefail
          umask 077
          [[ "$ATOLIN_SOURCE_SHA" =~ ^[a-f0-9]{40}$ ]]
          mkdir private-source
          "$RUNNER_TEMP/indira-ssh/ssh" "git -C /opt/atolin-assistant fetch origin fix/http-search-recovery-106 > /var/lib/atolin-build-106/fetch.log 2>&1 && git -C /opt/atolin-assistant archive $ATOLIN_SOURCE_SHA" > "$RUNNER_TEMP/source.tar"
          tar -xf "$RUNNER_TEMP/source.tar" -C private-source
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11'
          cache-disabled: true
      - name: Verify Java, SQL and isolated DOM behavior
        working-directory: private-source
        run: |
          set -euo pipefail
          if bash -se > "$RUNNER_TEMP/validation.log" 2>&1 <<'TASK'
          mkdir -p /tmp/atolin-context-tests
          for test in FolderContext NavigationSession WorkSession PageLoadWatch TransportProbe ConnectionIndicators ReportFormatter AutomationPlan NetworkRecoveryPlan AutomationCountdown RecoveryPlan LaunchGate; do
            javac -cp /tmp/atolin-context-tests -d /tmp/atolin-context-tests "app/src/main/java/ru/atolin/assistant/$test.java" "tests/${test}Test.java"
            java -cp /tmp/atolin-context-tests "ru.atolin.assistant.${test}Test"
          done
          javac -cp /tmp/atolin-context-tests -d /tmp/atolin-context-tests app/src/main/java/ru/atolin/assistant/HttpRecoveryPolicy.java app/src/main/java/ru/atolin/assistant/HttpFailureEvidence.java tests/HttpRecoveryTest.java
          java -cp /tmp/atolin-context-tests ru.atolin.assistant.HttpRecoveryTest
          python3 tests/report-storage.py
          npm install --no-save --package-lock=false playwright@1.51.1
          npx playwright install --with-deps chromium --only-shell
          for test in batch sorter scope local-observations search-online site-account visit description automation automation-list message-structure; do node "tests/$test-dom.cjs"; done
          TASK
          then echo 'PASS: Java recovery, diagnostics, SQL and isolated DOM'; else echo 'Validation failed; private log retained'; exit 1; fi
      - name: Compile Android application and instrumentation with pinned signing key
        working-directory: private-source
        run: |
          set -euo pipefail
          if bash -se > "$RUNNER_TEMP/build.log" 2>&1 <<'TASK'
          gradle --no-daemon clean assembleDebug assembleDebugAndroidTest
          bash scripts/verify-apk.sh app/build/outputs/apk/debug/app-debug.apk 106 0.106
          TASK
          then echo 'PASS: Android application, test APK and pinned signature'; else echo 'Android compilation failed; private log retained'; exit 1; fi
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Verify native Android UI and durable HTTP recovery
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: cd private-source && bash scripts/ui-smoke.sh > "$RUNNER_TEMP/android-ui.log" 2>&1
      - name: Verify fresh Android directory and retain verified APK privately
        working-directory: private-source
        env:
          ANDROID_USER_HOME: ${{ runner.temp }}/atolin-clean-android
        run: |
          set -euo pipefail
          cp app/build/outputs/apk/debug/app-debug.apk "$RUNNER_TEMP/verified-106.apk"
          if bash -se > "$RUNNER_TEMP/fresh-build.log" 2>&1 <<'TASK'
          gradle --no-daemon clean assembleDebug
          bash scripts/verify-apk.sh app/build/outputs/apk/debug/app-debug.apk 106 0.106
          TASK
          then echo 'PASS: fresh Android directory and pinned signature'; else echo 'Fresh build failed; private log retained'; exit 1; fi
          "$RUNNER_TEMP/indira-ssh/ssh" 'umask 077; mkdir -p /var/lib/atolin-build-106/ci; cat > /var/lib/atolin-build-106/ci/verified-106.apk' < "$RUNNER_TEMP/verified-106.apk"
          printf '%s\n' "$ATOLIN_SOURCE_SHA" | "$RUNNER_TEMP/indira-ssh/ssh" 'cat > /var/lib/atolin-build-106/ci/verified-source'
      - name: Retain private diagnostics on server
        if: always()
        run: |
          set -euo pipefail
          for name in validation build android-ui fresh-build; do
            if test -f "$RUNNER_TEMP/$name.log"; then "$RUNNER_TEMP/indira-ssh/ssh" "umask 077; mkdir -p /var/lib/atolin-build-106/ci; cat > /var/lib/atolin-build-106/ci/$name.log" < "$RUNNER_TEMP/$name.log"; fi
          done
      - name: Remove temporary private source and access
        if: always()
        run: rm -rf -- private-source "$RUNNER_TEMP/indira-ssh" "$RUNNER_TEMP/source.tar" "$RUNNER_TEMP/verified-106.apk"
